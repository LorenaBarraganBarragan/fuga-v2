[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuga-plus-backend"
version = "0.1.0"
description = "FUGA+ Backend API — control de gastos personales"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Framework
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    # Validación y configuración
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    # Base de datos
    "sqlalchemy>=2.0.28,<3.0.0",
    "psycopg[binary,pool]>=3.1.18,<4.0.0",
    # Autenticación
    "PyJWT[crypto]>=2.8.0,<3.0.0",
    "PyJWKS>=0.1.3,<0.2.0",
    # Logging estructurado
    "structlog>=24.1.0,<25.0.0",
    # Zona horaria
    # zoneinfo está en stdlib de Python 3.9+; tzdata para Windows
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    # Pruebas
    "pytest>=8.1.0,<9.0.0",
    "pytest-asyncio>=0.23.5,<0.24.0",
    "httpx>=0.27.0,<0.28.0",
    # Calidad
    "ruff>=0.3.0,<0.4.0",
    "mypy>=1.9.0,<2.0.0",
    # Auditoría de seguridad
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren TEST_DATABASE_URL",
    "security: pruebas de autorización y aislamiento",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = [
    "S101",   # assert permitido en pruebas
    "S105",   # contraseñas hardcoded solo en ejemplos
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
ignore_missing_imports = true
# Dominio puro con tipado estricto; servicios/repos en modo laxo
[[tool.mypy.overrides]]
module = "app.domain.*"
disallow_untyped_defs = true
