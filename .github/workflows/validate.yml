name: Validate FUGA+
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - name: Isolated tests and coverage without real providers
        run: python -B backend/scripts/test_safe.py --coverage
      - name: Minimum static checks
        run: |
          python -m ruff check backend/app backend/tests backend/scripts scripts --select F,E9,I --no-cache
          python -m mypy backend/app/domain --no-incremental
      - name: Candidate inventory and secret scan
        run: python -B scripts/check_candidate.py
      - name: Production launcher with synthetic configuration and loopback only
        run: python -B backend/scripts/smoke_start.py
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - name: Ephemeral runner database, never Supabase
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE fuga_ci LOGIN SUPERUSER PASSWORD 'disposable-runner-only';"
      - name: All tests with local SQL integration
        env:
          FUGA_TEST_DATABASE_URL: postgresql://fuga_ci:disposable-runner-only@127.0.0.1:5432/postgres
        run: python -B backend/scripts/test_safe.py --integration
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run test:coverage
        working-directory: mobile
